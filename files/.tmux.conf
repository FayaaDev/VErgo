# Tmux configuration
# Intentionally keep tmux keybindings at their defaults.

# Make color handling more predictable across terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g base-index 1
set -g mouse on

# Prevent shells/apps from overriding manual window/pane names.
# This fixes "rename" seemingly not sticking (e.g. reverting to hostname).
set -g allow-rename off
set -g automatic-rename off

# Don't let applications (including your shell) constantly update pane_title
# via OSC title sequences (often looks like "recent activity").
set -g allow-set-title off

# If you use pane titles (via `select-pane -T <name>`), show them on borders.
# This is optional, but makes pane renames visible.
set -g pane-border-status top
set -g pane-border-format "#{?pane_title,#{pane_title},#{pane_current_command}}"

# Optional theme (Catppuccin Macchiato), loaded only if installed locally.
# This keeps the config portable on remote servers.
if-shell '[ -f "$HOME/.tmux/plugins/catppuccin/tmux/catppuccin.tmux" ]' {
  set -g @catppuccin_flavor 'macchiato'
  run-shell "$HOME/.tmux/plugins/catppuccin/tmux/catppuccin.tmux"
}
